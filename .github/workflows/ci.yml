# Intégration continue — vérifications rapides, sans données.
#
# Ce workflow ne peut pas entraîner de modèle : le jeu de données Globo n'est pas
# versionné (221 Mo). Il vérifie donc ce qui est vérifiable sans lui — et c'est
# volontairement la moitié du travail MLOps : garantir que le code servi est sain
# et que les artefacts déployés sont cohérents entre eux.
#
# L'entraînement et l'évaluation vivent dans `train.yml`, déclenché manuellement.

name: CI

on:
  push:
    # `dev` est la branche de travail, `main` la branche de version. Sans `dev`
    # ici, un push de travail ne déclenchait rien : les défauts n'apparaissaient
    # qu'à l'ouverture de la fusion, c'est-à-dire trop tard pour être bon marché.
    branches: [main, dev]
  # Toutes les cibles : une fusion vers `main` doit être vérifiée même si la
  # branche d'origine l'a déjà été, parce que la fusion peut casser ce que les
  # deux côtés validaient séparément.
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer les dépendances de développement
        run: pip install -r requirements-dev.txt

      - name: Tests unitaires
        # Les tests tournent sur des artefacts synthétiques : aucune donnée requise.
        run: python -m pytest tests/ -q

      - name: Cohérence des copies du cœur de reco
        # Les trois solutions embarquent une copie de src/recommender.py. Une copie
        # périmée signifierait qu'une correction n'est pas déployée.
        run: python scripts/sync_recommender.py --check

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Aucun fichier volumineux versionné
        # Données et artefacts doivent rester hors du dépôt (Blob / HF Hub).
        run: |
          gros=$(find . -path ./.git -prune -o -type f -size +5M -print)
          if [ -n "$gros" ]; then
            echo "Fichiers de plus de 5 Mo versionnés :"; echo "$gros"; exit 1
          fi
          echo "aucun fichier volumineux"

      - name: Aucun artefact de modèle versionné
        run: |
          trouves=$(git ls-files 'models/*.npy' 'models/*.pkl' '*.db' | grep -v baseline || true)
          if [ -n "$trouves" ]; then
            echo "Artefacts versionnés par erreur :"; echo "$trouves"; exit 1
          fi
          echo "models/ propre"

      - name: Aucun secret en clair
        # Remplace une vérification qui ne cherchait que des affectations
        # `AZURE_STORAGE_CONNECTION_STRING=` / `HF_TOKEN=` dans les `.py` et
        # `.ipynb`. Elle laissait passer une chaîne de connexion collée telle
        # quelle, une clé de fonction dans une URL (`?code=…`), un jeton
        # Hugging Face — et n'importe lequel des trois dans un `.md`, alors que
        # les commandes de déploiement vivent dans la documentation.
        run: python scripts/check_secrets.py

  # Le poste de développement n'a pas Terraform installé : la configuration de
  # `infra/` a donc été écrite sans jamais être validée. Cette vérification est
  # ce qui la fait passer d'intention documentée à code contrôlé, et elle ne
  # demande **aucun accès à Azure** — `init -backend=false` récupère seulement
  # le fournisseur, `validate` contrôle le schéma hors ligne.
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Mise en forme canonique
        # `-diff` imprime la correction à appliquer : c'est le moyen d'obtenir
        # un format juste sans avoir Terraform en local.
        run: terraform -chdir=infra fmt -check -diff

      - name: Schéma des ressources
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate
